<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 05/10/2026 - Formulário de Login</title>
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <main>
        <div class="login-container">
            <div class="login-header">
                <h2>Bem Vindo</h2>
                <p>Digite suas informações de login</p>
            </div>

            <form class="login-form" action="#" method="get">
                <div class="input-group">
                    <label for="email">Digite seu E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com.br" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">Digite sua Senha</label>
                    <input type="password" id="password" name="password" placeholder="******" required autocomplete="current-password">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Esqueceu a senha</span>
                    </label>
                    <a href="#" class="forgot-link">Esqueceu a Senha?</a>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <div class="login-footer">
                <p>Não tem conta? <a href="#">Cadastre-se</a></p>
            </div>
        </div>
    </main>
</body>
</html>
